server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3307/spring
spring.datasource.username=springuser
spring.datasource.password=springpw
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

minio.url=${MINIO_URL:http://localhost}
minio.port=${MINIO_PORT:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadminpw}
minio.bucket=${MINIO_BUCKET:files}


security.jwt.secret=thisisanextremelylongsecretthatnobodywilleverguessisweartogodipromise
